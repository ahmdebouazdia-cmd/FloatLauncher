name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check source files
        run: |
          for f in GlassViews UiKit Controls FloatingService MainActivity; do
            test -f app/src/main/java/com/example/floatapp/$f.kt || (echo "Missing file: $f.kt" && exit 1)
          done

      - name: Generate project files
        run: |
          cat > settings.gradle << 'FILE_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FloatLauncher"
          include ':app'
          FILE_EOF
          cat > build.gradle << 'FILE_EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          FILE_EOF
          cat > gradle.properties << 'FILE_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          FILE_EOF
          mkdir -p app
          cat > app/build.gradle << 'FILE_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.floatapp'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.floatapp'
                  minSdk 26
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          FILE_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'FILE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <!-- يسمح برؤية التطبيقات المثبتة (لعرض أيقونة التطبيق) -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Float Launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingService"
                      android:exported="false" />
              </application>
          </manifest>
          FILE_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml << 'FILE_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path
                  android:fillColor="#0F1729"
                  android:pathData="M20,0h56a20,20 0 0 1 20,20v56a20,20 0 0 1 -20,20h-56a20,20 0 0 1 -20,-20v-56a20,20 0 0 1 20,-20z" />
              <path
                  android:fillColor="#D29BFF"
                  android:pathData="M40,20h34a4,4 0 0 1 4,4v34a4,4 0 0 1 -4,4h-34a4,4 0 0 1 -4,-4v-34a4,4 0 0 1 4,-4z" />
              <path
                  android:fillColor="#FFA81F"
                  android:pathData="M30,30h34a4,4 0 0 1 4,4v34a4,4 0 0 1 -4,4h-34a4,4 0 0 1 -4,-4v-34a4,4 0 0 1 4,-4z" />
              <path
                  android:fillColor="#19D3FF"
                  android:pathData="M20,40h34a4,4 0 0 1 4,4v34a4,4 0 0 1 -4,4h-34a4,4 0 0 1 -4,-4v-34a4,4 0 0 1 4,-4z" />
          </vector>
          FILE_EOF
          mkdir -p app/src/main/java/com/example/floatapp
          cat > app/src/main/java/com/example/floatapp/Tabs.kt << 'FILE_EOF'
          package com.example.floatapp

          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.os.Build
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.Toast

          // يجعل الصفحة تشبه التطبيقات + يخفي أزرار «Open app»
          private const val APP_JS = """
          (function(){
            try{
              var m=document.querySelector('meta[name=viewport]');
              if(!m){m=document.createElement('meta');m.name='viewport';document.head.appendChild(m);}
              m.content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no';
              if(!window.__fl){
                window.__fl=1;
                var s=document.createElement('style');
                s.textContent='*{-webkit-tap-highlight-color:transparent!important}html,body{overscroll-behavior:none}::-webkit-scrollbar{display:none}';
                document.head.appendChild(s);
                var re=/open app|open in app|open instagram|use the app|get the app|فتح التطبيق|افتح التطبيق|استخدم التطبيق/i;
                var hide=function(){
          var list=document.querySelectorAll('a,button,div[role="button"]');
          for(var i=0;i<list.length;i++){
            var t=(list[i].innerText||'').trim();
            if(t.length>0&&t.length<24&&re.test(t)){list[i].style.display='none';}
          }
                };
                var timer=null;
                var sched=function(){ if(timer) return; timer=setTimeout(function(){timer=null;hide();},400); };
                hide();
                new MutationObserver(sched).observe(document.documentElement,{childList:true,subtree:true});
              }
            }catch(e){}
          })();
          """

          // عرض الصفحة المنطقي بين 320 و412 dp ثم تُكبَّر/تُصغَّر لتملأ النافذة بالضبط
          internal fun FloatingService.fitWeb(web: WebView, cw: Int, ch: Int) {
              if (cw <= 0 || ch <= 0) return
              val d = resources.displayMetrics.density
              val baseDp = (cw / d / 0.8f).coerceIn(320f, 412f)
              val baseW = (baseDp * d).toInt()
              val scale = cw.toFloat() / baseW
              val newH = (ch / scale).toInt()
              val lp = web.layoutParams
              if (lp.width != baseW || lp.height != newH) {
                  lp.width = baseW
                  lp.height = newH
                  web.layoutParams = lp
              }
              web.pivotX = 0f
              web.pivotY = 0f
              web.scaleX = scale
              web.scaleY = scale
          }

          @Suppress("DEPRECATION")
          private fun FloatingService.enableDark(s: WebSettings) {
              if (Build.VERSION.SDK_INT >= 33) {
                  s.isAlgorithmicDarkeningAllowed = true
              } else if (Build.VERSION.SDK_INT >= 29) {
                  s.forceDark = WebSettings.FORCE_DARK_ON
              }
          }


          // ================= التبويبات (عدة تطبيقات) =================

          internal fun FloatingService.activeWeb(): WebView? = tabs.getOrNull(current)?.web

          @SuppressLint("SetJavaScriptEnabled")
          private fun FloatingService.newWebView(site: Int): WebView {
              val web = WebView(this)
              web.setBackgroundColor(Color.BLACK)
              val s = web.settings
              s.javaScriptEnabled = true
              s.domStorageEnabled = true
              s.mediaPlaybackRequiresUserGesture = false
              s.mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
              s.setSupportZoom(false)
              s.builtInZoomControls = false
              s.displayZoomControls = false
              s.userAgentString = s.userAgentString.replace("; wv", "").replace("Version/4.0 ", "")
              enableDark(s)
              web.overScrollMode = View.OVER_SCROLL_NEVER
              web.isVerticalScrollBarEnabled = false
              web.isHorizontalScrollBarEnabled = false
              CookieManager.getInstance().setAcceptThirdPartyCookies(web, true)
              web.webViewClient = object : WebViewClient() {
                  override fun onPageFinished(view: WebView?, url: String?) {
                      view?.evaluateJavascript(APP_JS, null)
                  }
              }
              // عرض الفيديو بملء النافذة (يوتيوب وغيره)
              web.webChromeClient = object : WebChromeClient() {
                  override fun onShowCustomView(view: View?, callback: WebChromeClient.CustomViewCallback?) {
                      showCustom(view, callback)
                  }

                  override fun onHideCustomView() {
                      hideCustom()
                  }
              }
              attachWebTouch(web)
              web.loadUrl(FloatingService.SITES[site].second)
              return web
          }

          internal fun FloatingService.addTab(site: Int) {
              val box = contentBox ?: return
              if (tabs.size >= FloatingService.MAX_TABS) {
                  Toast.makeText(this, "الحد الأقصى ${FloatingService.MAX_TABS} تطبيقات", Toast.LENGTH_SHORT).show()
                  return
              }
              val web = newWebView(site)
              web.visibility = View.GONE
              box.addView(web, FrameLayout.LayoutParams(dp(360), 1))
              tabs.add(Tab(site, web))
              fitWeb(web, box.width, box.height)
              switchTo(tabs.lastIndex)
          }

          internal fun FloatingService.switchTo(i: Int) {
              if (i !in tabs.indices) return
              hideCustom()
              current = i
              for ((idx, t) in tabs.withIndex()) {
                  if (idx == i) {
                      if (t.web.visibility != View.VISIBLE) {
                          t.web.alpha = 0f
                          t.web.visibility = View.VISIBLE
                          t.web.animate().alpha(1f).setStartDelay(0).setDuration(180).start()
                      }
                      t.web.onResume()
                  } else {
                      t.web.visibility = View.GONE
                      t.web.onPause()
                  }
              }
          }

          internal fun FloatingService.closeTab(i: Int) {
              if (i !in tabs.indices) return
              if (i == current) hideCustom()
              val t = tabs.removeAt(i)
              t.web.stopLoading()
              (t.web.parent as? ViewGroup)?.removeView(t.web)
              t.web.destroy()
              if (tabs.isEmpty()) {
                  closeWindowAnimated()
                  return
              }
              if (i < current) current -= 1
              current = current.coerceIn(0, tabs.lastIndex)
              switchTo(current)
          }

          // ================= الفيديو بملء النافذة =================

          internal fun FloatingService.showCustom(v: View?, cb: WebChromeClient.CustomViewCallback?) {
              val box = contentBox
              if (v == null || box == null || customView != null) {
                  cb?.onCustomViewHidden()
                  return
              }
              customView = v
              customCb = cb
              v.setBackgroundColor(Color.BLACK)
              box.addView(v, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
          }

          internal fun FloatingService.hideCustom() {
              val v = customView ?: return
              (v.parent as? ViewGroup)?.removeView(v)
              customCb?.onCustomViewHidden()
              customView = null
              customCb = null
          }
          FILE_EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FloatLauncher-APK
          path: app/build/outputs/apk/release/app-release.apk

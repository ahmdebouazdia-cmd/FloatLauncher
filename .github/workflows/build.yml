name: Build APK (all-in-one)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate project files
        run: |
          cat > settings.gradle << 'FILE_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FloatLauncher"
          include ':app'
          FILE_EOF
          cat > build.gradle << 'FILE_EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          FILE_EOF
          cat > gradle.properties << 'FILE_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          FILE_EOF
          mkdir -p app
          cat > app/build.gradle << 'FILE_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.floatapp'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.floatapp'
                  minSdk 26
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          FILE_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'FILE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <!-- يسمح برؤية التطبيقات المثبتة (لعرض أيقونة التطبيق) -->
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="Float Launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingService"
                      android:exported="false" />
              </application>
          </manifest>
          FILE_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml << 'FILE_EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path
                  android:fillColor="#0F1729"
                  android:pathData="M20,0h56a20,20 0 0 1 20,20v56a20,20 0 0 1 -20,20h-56a20,20 0 0 1 -20,-20v-56a20,20 0 0 1 20,-20z" />
              <path
                  android:fillColor="#D29BFF"
                  android:pathData="M40,20h34a4,4 0 0 1 4,4v34a4,4 0 0 1 -4,4h-34a4,4 0 0 1 -4,-4v-34a4,4 0 0 1 4,-4z" />
              <path
                  android:fillColor="#FFA81F"
                  android:pathData="M30,30h34a4,4 0 0 1 4,4v34a4,4 0 0 1 -4,4h-34a4,4 0 0 1 -4,-4v-34a4,4 0 0 1 4,-4z" />
              <path
                  android:fillColor="#19D3FF"
                  android:pathData="M20,40h34a4,4 0 0 1 4,4v34a4,4 0 0 1 -4,4h-34a4,4 0 0 1 -4,-4v-34a4,4 0 0 1 4,-4z" />
          </vector>
          FILE_EOF
          mkdir -p app/src/main/java/com/example/floatapp
          cat > app/src/main/java/com/example/floatapp/MainActivity.kt << 'FILE_EOF'
          package com.example.floatapp

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.*

          class MainActivity : Activity() {

              private val prefs by lazy { getSharedPreferences(FloatingService.PREFS, Context.MODE_PRIVATE) }
              private lateinit var siteLabel: TextView
              private lateinit var sizeLabel: TextView
              private lateinit var winLabel: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val pad = (20 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad * 2, pad, pad)
                      gravity = Gravity.CENTER_HORIZONTAL
                  }

                  siteLabel = TextView(this).apply { textSize = 18f }
                  val pickBtn = Button(this).apply {
                      text = "اختر الموقع"
                      setOnClickListener { pickSite() }
                  }

                  sizeLabel = TextView(this).apply { textSize = 16f }
                  val seek = SeekBar(this).apply {
                      max = 110 // من 40 إلى 150 dp
                      progress = prefs.getInt(FloatingService.KEY_SIZE, FloatingService.DEFAULT_SIZE) - 40
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar, p: Int, fromUser: Boolean) {
                              sizeLabel.text = "حجم الأيقونة: ${p + 40} dp"
                              FloatingService.instance?.setSize(p + 40)
                          }
                          override fun onStartTrackingTouch(s: SeekBar) {}
                          override fun onStopTrackingTouch(s: SeekBar) {
                              prefs.edit().putInt(FloatingService.KEY_SIZE, s.progress + 40).apply()
                          }
                      })
                  }

                  winLabel = TextView(this).apply { textSize = 16f }
                  val winSeek = SeekBar(this).apply {
                      max = 70 // من 30% إلى 100% من عرض الشاشة
                      progress = prefs.getInt(FloatingService.KEY_WIN, FloatingService.DEFAULT_WIN) - 30
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar, p: Int, fromUser: Boolean) {
                              winLabel.text = "حجم النافذة: ${p + 30}% من عرض الشاشة"
                              FloatingService.instance?.setWindowPercent(p + 30)
                          }
                          override fun onStartTrackingTouch(s: SeekBar) {}
                          override fun onStopTrackingTouch(s: SeekBar) {
                              prefs.edit().putInt(FloatingService.KEY_WIN, s.progress + 30).apply()
                          }
                      })
                  }

                  val startBtn = Button(this).apply {
                      text = "تشغيل الأيقونة العائمة"
                      setOnClickListener { startFloating() }
                  }
                  val stopBtn = Button(this).apply {
                      text = "إيقاف"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, FloatingService::class.java))
                      }
                  }

                  listOf(siteLabel, pickBtn, sizeLabel, seek, winLabel, winSeek, startBtn, stopBtn).forEach {
                      root.addView(it, LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = pad / 2 })
                  }
                  setContentView(root)
                  refreshLabels()

                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
              }

              private fun refreshLabels() {
                  val idx = prefs.getInt(FloatingService.KEY_SITE, 0).coerceIn(0, FloatingService.SITES.lastIndex)
                  siteLabel.text = "الموقع: ${FloatingService.SITES[idx].first}"
                  sizeLabel.text = "حجم الأيقونة: ${prefs.getInt(FloatingService.KEY_SIZE, FloatingService.DEFAULT_SIZE)} dp"
                  winLabel.text = "حجم النافذة: ${prefs.getInt(FloatingService.KEY_WIN, FloatingService.DEFAULT_WIN)}% من عرض الشاشة"
              }

              private fun pickSite() {
                  AlertDialog.Builder(this)
                      .setTitle("اختر الموقع")
                      .setItems(FloatingService.SITES.map { it.first }.toTypedArray()) { _, i ->
                          prefs.edit().putInt(FloatingService.KEY_SITE, i).apply()
                          refreshLabels()
                          FloatingService.instance?.onSiteChanged()
                      }
                      .show()
              }

              private fun startFloating() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "فعّل «العرض فوق التطبيقات الأخرى» ثم ارجع", Toast.LENGTH_LONG).show()
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      )
                      return
                  }
                  if (FloatingService.instance == null) {
                      startForegroundService(Intent(this, FloatingService::class.java))
                  }
              }
          }
          FILE_EOF
          mkdir -p app/src/main/java/com/example/floatapp
          cat > app/src/main/java/com/example/floatapp/FloatingService.kt << 'FILE_EOF'
          package com.example.floatapp

          import android.annotation.SuppressLint
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.IBinder
          import android.view.*
          import android.view.inputmethod.InputMethodManager
          import android.webkit.CookieManager
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.abs

          class FloatingService : Service() {

              companion object {
                  const val PREFS = "cfg"
                  const val KEY_SITE = "site"
                  const val KEY_SIZE = "size"
                  const val KEY_WIN = "win"
                  const val DEFAULT_SIZE = 70 // حجم الأيقونة dp
                  const val DEFAULT_WIN = 70  // عرض النافذة % من الشاشة

                  // الاسم، الرابط، حزمة التطبيق (لعرض أيقونته إن كان مثبتاً)
                  val SITES = listOf(
                      Triple("Instagram", "https://www.instagram.com/", "com.instagram.android"),
                      Triple("Facebook", "https://m.facebook.com/", "com.facebook.katana"),
                      Triple("YouTube", "https://m.youtube.com/", "com.google.android.youtube"),
                      Triple("TikTok", "https://www.tiktok.com/", "com.zhiliaoapp.musically"),
                      Triple("X (Twitter)", "https://mobile.twitter.com/", "com.twitter.android"),
                      Triple("Telegram", "https://web.telegram.org/k/", "org.telegram.messenger")
                  )

                  @Volatile
                  var instance: FloatingService? = null
              }

              private val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
              private val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
              private val baseFlags = WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                      WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED

              // عرض الصفحة المنطقي ثابت (كأنها شاشة هاتف)، ثم تُصغَّر لتناسب النافذة
              private val BASE_WIDTH_DP = 400

              private lateinit var wm: WindowManager
              private lateinit var bubbleParams: WindowManager.LayoutParams
              private var bubble: ImageView? = null
              private var bubbleAttached = false

              private var winParams: WindowManager.LayoutParams? = null
              private var windowView: FrameLayout? = null
              private var webView: WebView? = null
              private var kbBtn: TextView? = null
              private var attached = false
              private var kbOn = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  startForeground(1, buildNotification())
                  createBubble()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY

              private fun prefs() = getSharedPreferences(PREFS, Context.MODE_PRIVATE)
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun site() = SITES[prefs().getInt(KEY_SITE, 0).coerceIn(0, SITES.lastIndex)]

              private fun buildNotification(): Notification {
                  val channelId = "float_channel"
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel(channelId, "Float Launcher", NotificationManager.IMPORTANCE_MIN)
                  )
                  return Notification.Builder(this, channelId)
                      .setContentTitle("الأيقونة العائمة تعمل")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .build()
              }

              // ---------- سحب أي عنصر عائم (وإذا لم يُسحب يُعتبر ضغطة) ----------
              @SuppressLint("ClickableViewAccessibility")
              private fun attachDrag(
                  target: View,
                  p: WindowManager.LayoutParams,
                  host: View,
                  onTap: (() -> Unit)? = null
              ) {
                  var sx = 0
                  var sy = 0
                  var tx = 0f
                  var ty = 0f
                  var moved = false
                  target.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = p.x; sy = p.y
                              tx = e.rawX; ty = e.rawY
                              moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - tx
                              val dy = e.rawY - ty
                              if (abs(dx) > 10 || abs(dy) > 10) moved = true
                              if (moved) {
                                  p.x = sx + dx.toInt()
                                  p.y = sy + dy.toInt()
                                  wm.updateViewLayout(host, p)
                              }
                          }
                          MotionEvent.ACTION_UP -> if (!moved) onTap?.invoke()
                      }
                      true
                  }
              }

              // ---------- الأيقونة العائمة ----------
              private fun createBubble() {
                  val size = dp(prefs().getInt(KEY_SIZE, DEFAULT_SIZE))
                  bubbleParams = WindowManager.LayoutParams(
                      size, size,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 20
                      y = 300
                  }
                  val view = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      alpha = 0.9f
                  }
                  attachDrag(view, bubbleParams, view) { toggleWindow() }
                  bubble = view
                  showBubble()
                  applyIcon()
              }

              // الأيقونة تختفي عند فتح النافذة وتعود عند إخفائها أو إغلاقها
              private fun showBubble() {
                  val v = bubble ?: return
                  if (!bubbleAttached) {
                      wm.addView(v, bubbleParams)
                      bubbleAttached = true
                  }
              }

              private fun hideBubble() {
                  val v = bubble ?: return
                  if (bubbleAttached) {
                      wm.removeView(v)
                      bubbleAttached = false
                  }
              }

              fun setSize(sizeDp: Int) {
                  val view = bubble ?: return
                  val px = dp(sizeDp)
                  bubbleParams.width = px
                  bubbleParams.height = px
                  if (bubbleAttached) wm.updateViewLayout(view, bubbleParams)
              }

              fun applyIcon() {
                  val view = bubble ?: return
                  try {
                      view.setImageDrawable(packageManager.getApplicationIcon(site().third))
                  } catch (e: Exception) {
                      view.setImageResource(R.drawable.ic_launcher)
                  }
              }

              // عند تغيير الموقع من الإعدادات
              fun onSiteChanged() {
                  applyIcon()
                  webView?.loadUrl(site().second)
              }

              // ---------- النافذة العائمة ----------
              private fun windowSize(pct: Int): Pair<Int, Int> {
                  val dm = resources.displayMetrics
                  val w = (dm.widthPixels * pct / 100f).toInt()
                  val h = minOf((w * 1.6f).toInt(), (dm.heightPixels * 0.85f).toInt())
                  return Pair(w, h)
              }

              // تغيير حجم النافذة مباشرة من الشريط
              fun setWindowPercent(pct: Int) {
                  val p = winParams ?: return
                  val v = windowView ?: return
                  val (w, h) = windowSize(pct)
                  p.width = w
                  p.height = h
                  if (attached) wm.updateViewLayout(v, p)
              }

              private fun toggleWindow() {
                  when {
                      windowView == null -> createWindow()
                      attached -> hideWindow()
                      else -> showWindow()
                  }
              }

              // ضبط حجم الصفحة ليتناسب مع النافذة: تُعرض بعرض ثابت ثم تُصغَّر/تُكبَّر
              private fun fitWeb(web: WebView, cw: Int, ch: Int) {
                  if (cw <= 0 || ch <= 0) return
                  val baseW = dp(BASE_WIDTH_DP)
                  val scale = cw.toFloat() / baseW
                  val newH = (ch / scale).toInt()
                  val lp = web.layoutParams
                  if (lp.width != baseW || lp.height != newH) {
                      lp.width = baseW
                      lp.height = newH
                      web.layoutParams = lp
                  }
                  web.pivotX = 0f
                  web.pivotY = 0f
                  web.scaleX = scale
                  web.scaleY = scale
              }

              @Suppress("DEPRECATION")
              private fun enableDark(s: WebSettings) {
                  if (Build.VERSION.SDK_INT >= 33) {
                      s.isAlgorithmicDarkeningAllowed = true
                  } else if (Build.VERSION.SDK_INT >= 29) {
                      s.forceDark = WebSettings.FORCE_DARK_ON
                  }
              }

              @SuppressLint("SetJavaScriptEnabled", "ClickableViewAccessibility")
              private fun createWindow() {
                  val dm = resources.displayMetrics
                  val (w, h) = windowSize(prefs().getInt(KEY_WIN, DEFAULT_WIN))
                  val p = WindowManager.LayoutParams(
                      w, h,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      baseFlags or WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = (dm.widthPixels - w) / 2
                      y = (dm.heightPixels * 0.1f).toInt()
                      softInputMode = WindowManager.LayoutParams.SOFT_INPUT_ADJUST_PAN
                  }

                  val root = FrameLayout(this)
                  root.background = GradientDrawable().apply {
                      setColor(Color.BLACK)
                      cornerRadius = dp(10).toFloat()
                      setStroke(dp(1), 0xFF444444.toInt())
                  }
                  root.clipToOutline = true

                  val column = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }

                  // الشريط العلوي
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(0xFF1E1E1E.toInt())
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  fun headerBtn(label: String, onClick: () -> Unit) = TextView(this).apply {
                      text = label
                      setTextColor(Color.WHITE)
                      textSize = 17f
                      gravity = Gravity.CENTER
                      setPadding(dp(14), 0, dp(14), 0)
                      setOnClickListener { onClick() }
                  }
                  header.addView(headerBtn("◀") { webView?.let { if (it.canGoBack()) it.goBack() } },
                      LinearLayout.LayoutParams(WRAP, MATCH))
                  val kb = headerBtn("⌨") { toggleKeyboard() }
                  kbBtn = kb
                  header.addView(kb, LinearLayout.LayoutParams(WRAP, MATCH))
                  header.addView(View(this), LinearLayout.LayoutParams(0, MATCH, 1f)) // مساحة السحب
                  header.addView(headerBtn("—") { hideWindow() }, LinearLayout.LayoutParams(WRAP, MATCH))
                  header.addView(headerBtn("✕") { closeWindow() }, LinearLayout.LayoutParams(WRAP, MATCH))
                  column.addView(header, LinearLayout.LayoutParams(MATCH, dp(38)))
                  attachDrag(header, p, root)

                  // المتصفح (خلفية سوداء + وضع داكن للمواقع)
                  val web = WebView(this)
                  web.setBackgroundColor(Color.BLACK)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.mediaPlaybackRequiresUserGesture = false
                  web.settings.userAgentString = web.settings.userAgentString.replace("; wv", "")
                  enableDark(web.settings)
                  web.webViewClient = WebViewClient()
                  web.loadUrl(site().second)

                  val container = FrameLayout(this)
                  container.setBackgroundColor(Color.BLACK)
                  container.addView(web, FrameLayout.LayoutParams(dp(BASE_WIDTH_DP), 1))
                  container.addOnLayoutChangeListener { _, l, t, r, b, _, _, _, _ ->
                      fitWeb(web, r - l, b - t)
                  }
                  column.addView(container, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  root.addView(column, FrameLayout.LayoutParams(MATCH, MATCH))

                  // مقبض تغيير الحجم (الزاوية السفلية)
                  val handle = TextView(this).apply {
                      text = "◢"
                      setTextColor(Color.WHITE)
                      textSize = 20f
                      gravity = Gravity.CENTER
                      setBackgroundColor(0x66000000)
                  }
                  root.addView(handle, FrameLayout.LayoutParams(dp(38), dp(38), Gravity.BOTTOM or Gravity.END))
                  var rw = 0
                  var rh = 0
                  var tx = 0f
                  var ty = 0f
                  handle.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              rw = p.width; rh = p.height
                              tx = e.rawX; ty = e.rawY
                          }
                          MotionEvent.ACTION_MOVE -> {
                              p.width = (rw + (e.rawX - tx)).toInt().coerceIn(dp(160), dm.widthPixels)
                              p.height = (rh + (e.rawY - ty)).toInt().coerceIn(dp(200), dm.heightPixels)
                              wm.updateViewLayout(root, p)
                          }
                      }
                      true
                  }

                  winParams = p
                  windowView = root
                  webView = web
                  wm.addView(root, p)
                  attached = true
                  hideBubble()
              }

              private fun hideWindow() {
                  val v = windowView ?: return
                  if (kbOn) toggleKeyboard()
                  if (attached) wm.removeView(v)
                  attached = false
                  webView?.onPause()
                  showBubble()
              }

              private fun showWindow() {
                  val v = windowView ?: return
                  val p = winParams ?: return
                  if (!attached) wm.addView(v, p)
                  attached = true
                  webView?.onResume()
                  hideBubble()
              }

              // إغلاق كامل وتحرير ذاكرة المتصفح
              private fun closeWindow() {
                  val v = windowView ?: return
                  if (attached) wm.removeView(v)
                  attached = false
                  v.removeAllViews()
                  webView?.apply {
                      stopLoading()
                      destroy()
                  }
                  webView = null
                  windowView = null
                  winParams = null
                  kbBtn = null
                  kbOn = false
                  CookieManager.getInstance().flush()
                  showBubble()
              }

              // زر لوحة المفاتيح: يجعل النافذة قابلة للكتابة (قد توقف اللعبة مؤقتاً أثناء الكتابة)
              private fun toggleKeyboard() {
                  val v = windowView ?: return
                  val p = winParams ?: return
                  kbOn = !kbOn
                  p.flags = if (kbOn) baseFlags else baseFlags or WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                  if (attached) wm.updateViewLayout(v, p)
                  kbBtn?.setTextColor(if (kbOn) 0xFF4CAF50.toInt() else Color.WHITE)
                  if (kbOn) {
                      webView?.requestFocus()
                  } else {
                      val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                      imm.hideSoftInputFromWindow(v.windowToken, 0)
                  }
              }

              override fun onDestroy() {
                  closeWindow()
                  hideBubble()
                  bubble = null
                  instance = null
                  super.onDestroy()
              }
          }
          FILE_EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FloatLauncher-APK
          path: app/build/outputs/apk/release/app-release.apk
